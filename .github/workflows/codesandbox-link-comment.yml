name: Add codesandbox link

on:
  pull_request:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  codesandbox-comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # Явно даём права на запись комментариев
    steps:
      - uses: mshick/add-pr-comment@v2
        with:
          message: |
            Sandbox: https://githubbox.com/${{ github.repository }}/tree/${{ github.head_ref }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}  # Правильное имя параметра
          message-id: add-pr-comment
